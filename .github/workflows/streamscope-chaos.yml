name: Synthetic stream chaos integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci && npm run build
      - name: Checkout pinned streamscope companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: developjik/streamscope
          ref: 17e5bb642c68d83d0a3f17f05e0fc03e1dbfeb1f
          path: .tmp/streamscope
          persist-credentials: false
      - run: npm ci && npm run build
        working-directory: .tmp/streamscope
      - run: npx playwright install --with-deps chromium
      - name: Control, delay, disconnect and identical reproduction
        run: node examples/streamscope-chaos/run.mjs --seed 1337
        env:
          STREAMSCOPE_ENTRY: .tmp/streamscope/dist/index.js
      - name: Preserve all case evidence, including expected fixture failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-stream-chaos
          path: test-results/streamscope-chaos
          if-no-files-found: warn
          retention-days: 7
